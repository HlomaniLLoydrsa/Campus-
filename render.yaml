services:
  - type: web
    name: campus-social
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: campus-data
      mountPath: /var/data
      sizeGB: 1
