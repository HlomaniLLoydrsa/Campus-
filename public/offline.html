<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VYBE — Offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #00002A, #1A3F75); color: #EAF2FA;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      padding: 24px; text-align: center;
    }
    .card { max-width: 360px; }
    .logo {
      width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 20px;
      background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 800;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: rgba(234,242,250,0.75); font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
    button {
      background: #EAF2FA; color: #1A3F75; border: 0; border-radius: 12px;
      padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">V</div>
    <h1>You're offline</h1>
    <p>VYBE needs an internet connection to load new content. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
